# Builds the DACS Community platform and publishes it to GitHub Pages.
# Pull requests are built and tested but not deployed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Write Firebase configuration
        # Repository variables (Settings → Secrets and variables → Actions →
        # Variables) override the values in .env.example when they are set.
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_GOOGLE_ADMIN_CLIENT_ID: ${{ vars.VITE_GOOGLE_ADMIN_CLIENT_ID }}
        run: node scripts/ci-env.mjs

      - name: Run unit tests
        run: npm test

      - name: Build
        env:
          # "/<repository>" for a project site, empty for a custom domain or a
          # <user>.github.io repository. A BASE_PATH repository variable overrides it.
          BASE_PATH: ${{ vars.BASE_PATH || steps.pages.outputs.base_path || '/' }}
        run: npm run build

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
