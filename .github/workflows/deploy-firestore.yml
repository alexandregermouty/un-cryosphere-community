# Deploys firestore.rules and firestore.indexes.json to the Firebase project.
# GitHub Pages only hosts the web pages: the database rules still live in
# Firebase and must be deployed whenever a release changes them.
#
# Run manually from the Actions tab. Requires a repository secret
# FIREBASE_SERVICE_ACCOUNT containing the JSON key of a Google Cloud service
# account with the "Firebase Rules Admin" and "Cloud Datastore Index Admin" roles.
name: Deploy Firestore rules

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'cryohub-eb898' }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Add the FIREBASE_SERVICE_ACCOUNT repository secret first."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@14.22.0 deploy --only firestore --project "$PROJECT_ID" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
